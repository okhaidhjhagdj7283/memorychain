version: '3.8'

# MemoryChain dùng SQLite — không cần database server
# File này chỉ dành cho Prisma Studio (GUI xem dữ liệu)
services:
  prisma-studio:
    image: node:20-alpine
    container_name: memorychain_studio
    working_dir: /app
    volumes:
      - ../../packages/db:/app
      - ./dev.db:/app/prisma/dev.db
    environment:
      DATABASE_URL: "file:/app/prisma/dev.db"
    command: npx prisma studio --port 5555 --browser none
    ports:
      - "5555:5555"
